<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    background:#222;
    font-family:Arial, Helvetica, sans-serif;
    color:#333;
}
.form-page{
    width:100%;
    max-width:900px;
    margin:20px auto;
    background:white;
    position:relative;
    overflow:hidden;
    min-height:1200px;
    padding:70px 55px 100px;
}
/* TOP WAVE */
.form-page::before{
    content:"";
    position:absolute;
    top:-100px;
    left:-100px;
    width:115%;
    height:180px;
    background:#075b70;
    border-radius:0 0 60% 20%;
    transform:rotate(-5deg);
}
.form-page::after{
    content:"";
    position:absolute;
    bottom:-90px;
    left:-80px;
    width:115%;
    height:150px;
    background:#075b70;
    border-radius:50% 50% 0 0;
}
/* HEADER */
.header{
    position:relative;
    text-align:right;
    z-index:2;
    margin-bottom:30px;
}
.company{
    color:#76c6dc;
    font-size:28px;
    letter-spacing:1px;
    margin-bottom:10px;
}
.title{
    color:#075b70;
    font-size:48px;
    font-weight:bold;
    line-height:1.05;
}
.form-number{
    display:inline-block;
    border:3px solid #17667a;
    color:#075b70;
    font-weight:bold;
    font-size:17px;
    padding:10px 18px;
    margin-top:25px;
}
/* DATE */
.date{
    text-align:right;
    margin:10px 0 20px;
    font-size:15px;
}
.date input{
    border:none;
    border-bottom:1px solid #777;
    outline:none;
    width:190px;
    font-size:15px;
}
/* SECTION */
.section{
    margin-top:25px;
}
.section-title{
    color:#075b70;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}
/* ROW */
.row{
    display:grid;
    grid-template-columns:170px 1fr 170px 1fr;
    align-items:center;
    gap:10px;
    margin:14px 0;
}
.row.full{
    grid-template-columns:170px 1fr;
}
label{
    font-size:14px;
    font-weight:bold;
}
input[type="text"],
input[type="date"],
input[type="tel"],
input[type="email"],
select{
    width:100%;
    border:none;
    border-bottom:2px solid #999;
    outline:none;
    padding:5px 3px;
    font-size:15px;
    background:transparent;
}
hr{
    border:none;
    border-top:2px solid #bbb;
    margin:30px 0;
}
/* RADIO */
.radio-group{
    display:flex;
    align-items:center;
    gap:30px;
}
.radio-group label{
    font-weight:normal;
}
.radio-group input{
    margin-right:6px;
}
/* PHOTO AREA */
.photo-section{
    margin-top:30px;
    display:flex;
    align-items:flex-start;
    gap:30px;
}
.photo-box{
    width:160px;
    height:190px;
    border:2px dashed #1e778dff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f7f7f7;
    position:relative;
}
.photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}
.photo-placeholder{
    text-align:center;
    color:#777;
    font-size:14px;
    padding:15px;
    position:absolute;
}
.photo-controls{
    flex:1;
}
.photo-controls h3{
    color:#075b70;
    margin-top:0;
}
.photo-controls input[type="file"]{
    margin-top:10px;
    width:100%;
}
/* FOOTER */
.footer{
    position:absolute;
    bottom:35px;
    left:55px;
    right:55px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    z-index:3;
    font-size:12px;
}
.footer-left{
    line-height:1.5;
}
.signature{
    text-align:center;
}
.signature-line{
    width:180px;
    border-top:2px solid #777;
    margin-bottom:8px;
}
/* BUTTONS */
.buttons{
    text-align:center;
    margin-top:35px;
    position:relative;
    z-index:5;
}
button{
    background:#075b70;
    color:white;
    border:none;
    padding:12px 28px;
    margin:5px;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#06495a;
}
/* MOBILE */
@media(max-width:700px){
    .form-page{
        margin:0;
        padding:55px 25px 130px;
        min-height:1300px;
    }
    .company{
        font-size:18px;
    }
    .title{
        font-size:34px;
    }
    .form-number{
        font-size:14px;
    }
    .row,
    .row.full{
        grid-template-columns:1fr;
        gap:5px;
        margin-bottom:18px;
    }
    .radio-group{
        flex-wrap:wrap;
        gap:15px;
    }
    .photo-section{
        flex-direction:column;
    }
    .photo-box{
        width:150px;
        height:180px;
    }
    .footer{
        left:25px;
        right:25px;
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }
    .signature{
        align-self:flex-end;
    }
}
</style>
</head>
<body>

<!-- Aapka email direct set kar diya gaya hai -->
<form action="https://formsubmit.co/sharmarishabh504@gmail.com" method="POST" enctype="multipart/form-data" class="form-page">

    <!-- FormSubmit Settings -->
    <input type="hidden" name="_subject" value="New Registration Form - CM SOE GIRLS SBG">
    <input type="hidden" name="_captcha" value="false">

    <!-- HEADER -->
    <div class="header">
        <div class="company">CM SOE GIRLS SBG</div>
        <div class="title">REGISTRATION<br>FORM</div>
        <div class="form-number">FORM NO: #12345</div>
    </div>

    <!-- DATE -->
    <div class="date">
        Date: <input type="date" name="submission_date" id="date">
    </div>

    <!-- PERSONAL INFORMATION -->
    <div class="section">
        <div class="section-title">PERSONAL INFORMATION</div>

        <div class="row full">
            <label>FULL NAME</label>
            <input type="text" name="full_name" id="fullName" required>
        </div>

        <div class="row full">
            <label>GENDER</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
        </div>

        <div class="row">
            <label>DATE OF BIRTH</label>
            <input type="date" name="dob" id="dob">

            <label>PLACE OF BIRTH</label>
            <input type="text" name="birth_place" id="birthPlace">
        </div>

        <div class="row">
            <label>NATIONALITY</label>
            <input type="text" name="nationality" id="nationality">

            <label>RELIGION</label>
            <select name="religion" id="religion">
                <option value="">select religion</option>
                <option value="Hindu">Hindu</option>
                <option value="Muslim">Muslim</option>
                <option value="Jainism">Jainism</option>
                <option value="Buddhism">Buddhism</option>
            </select>
        </div>

        <div class="row full">
            <label>RESIDENCE STATUS</label>
            <div class="radio-group">
                <label><input type="radio" name="residence_status" value="Residence"> Residence</label>
                <label><input type="radio" name="residence_status" value="Non Residence"> Non Residence</label>
            </div>
        </div>

        <div class="row full">
            <label>MARITAL STATUS</label>
            <div class="radio-group">
                <label><input type="radio" name="marital_status" value="Single"> Single</label>
                <label><input type="radio" name="marital_status" value="Married"> Married</label>
                <label><input type="radio" name="marital_status" value="Widowed"> Widowed</label>
            </div>
        </div>

        <div class="row">
            <label>AADHAAR NO</label>
            <input type="text" name="aadhaar_no" id="aadhaarNo" placeholder="Enter Aadhaar Number" required>

            <label>PIN NO</label>
            <input type="text" name="pin_no" id="Pin">
        </div>
    </div>

    <hr>

    <!-- CONTACT INFORMATION -->
    <div class="section">
        <div class="section-title">CONTACT INFORMATION</div>

        <div class="row full">
            <label>ADDRESS</label>
            <input type="text" name="address" id="address">
        </div>

        <div class="row">
            <label>CITY</label>
            <input type="text" name="city" id="city">

            <label>STATE</label>
            <input type="text" name="state" id="state">
        </div>

        <div class="row">
            <label>ZIP CODE</label>
            <input type="text" name="zip_code" id="zip">

            <label>COUNTRY</label>
            <input type="text" name="country" id="country" value="India">
        </div>

        <div class="row">
            <label>PHONE (MOBILE)</label>
            <input type="tel" name="phone_number" id="phone" placeholder="Enter Mobile Number" required>

            <label>EMAIL</label>
            <input type="email" name="email" id="email">
        </div>
    </div>

    <hr>

    <!-- PHOTOGRAPH -->
    <div class="section">
        <div class="section-title">PHOTOGRAPH</div>
        <div class="photo-section">
            <div class="photo-box">
                <img id="photoPreview">
                <div class="photo-placeholder" id="photoText">PHOTO<br>PREVIEW</div>
            </div>
            <div class="photo-controls">
                <h3><u>UPLOAD PHOTO</u></h3>
                <p>Please select your passport-size photograph.</p>
                <input type="file" name="student_photo" id="photo" accept="image/*" onchange="previewPhoto(event)">
            </div>
        </div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
        <button type="submit">SUBMIT FORM</button>
        <button type="button" onclick="window.print()">PRINT</button>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="footer-left">
            +000-000-0000<br>
            www.example.com
        </div>
        <div>
            123 Street name, City,<br>
            State - 00000
        </div>
        <div class="signature">
            <div class="signature-line"></div>
            Signature
        </div>
    </div>

</form>

<script>
/* PHOTO PREVIEW */
function previewPhoto(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const img = document.getElementById("photoPreview");
        const text = document.getElementById("photoText");
        img.src = e.target.result;
        img.style.display = "block";
        text.style.display = "none";
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
